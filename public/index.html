<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mars Demo Shop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="brand">Mars Demo Shop</p>
        <h1>Orders on App Platform</h1>
        <p class="lede">
          Static UI talking to a Node API and managed Postgres.
          Use the actions below to browse orders or generate traffic.
        </p>
        <div class="actions">
          <button type="button" id="btn-health">Check API</button>
          <button type="button" id="btn-create" class="primary">Create order</button>
          <button type="button" id="btn-cancel">Cancel latest order</button>
          <button type="button" id="btn-lookup">Lookup by email</button>
          <button type="button" id="btn-seed">Load sample orders</button>
          <button type="button" id="btn-hammer">Email lookups (×40)</button>
          <button type="button" id="btn-stress">API load test (×40)</button>
          <button type="button" id="btn-burn-cpu">CPU load ~95% / 90s</button>
          <button type="button" id="btn-burn-mem">Memory load ~95%</button>
        </div>
      </header>

      <section class="panel" aria-live="polite">
        <h2>Status</h2>
        <pre id="status">Ready. Click an action.</pre>
      </section>

      <section class="panel">
        <h2>Recent orders</h2>
        <ul id="orders"></ul>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
